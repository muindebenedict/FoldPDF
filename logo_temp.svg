<svg width="360" height="360" viewBox="0 0 360 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Beautiful multi-stop linear gradient for 3D depth and metallic gloss -->
    <linearGradient id="fgrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0c2057"/>
      <stop offset="25%" stop-color="#1a3a8f"/>
      <stop offset="60%" stop-color="#3b6fd4"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    
    <!-- Shadow gradient for the page fold ear -->
    <linearGradient id="earGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071131"/>
      <stop offset="100%" stop-color="#0f2057"/>
    </linearGradient>
    
    <!-- Smooth drop shadow filter for 3D realism -->
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Base F logo path scaled to 360x360, with stroke and rounded join for elegant finish -->
    <path d="M80 40 L240 40 L300 100 L300 120 L140 120 L140 160 L260 160 L260 210 L140 210 L140 320 L80 320 Z" 
          fill="url(#fgrad)" 
          stroke="url(#fgrad)" 
          stroke-width="12" 
          stroke-linejoin="round"/>
          
    <!-- Overlapping folder corner ear with gradient fill -->
    <path d="M240 40 L240 100 L300 100 Z" 
          fill="url(#earGrad)" 
          stroke="url(#earGrad)" 
          stroke-width="4" 
          stroke-linejoin="round"/>
  </g>
</svg>